# Nightly Wikidata ingestion. Preferred over Vercel Cron for the full run,
# since serverless functions have short time limits.
name: ingest
on:
  schedule: [{ cron: "0 9 * * *" }]
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
    steps:
      # Until a DATABASE_URL secret exists there's nowhere to write, so skip rather than ingest into a throwaway DB.
      - if: env.DATABASE_URL == ''
        run: echo "No DATABASE_URL secret yet; skipping ingestion." && exit 0
      - if: env.DATABASE_URL != ''
        uses: actions/checkout@v4
      - if: env.DATABASE_URL != ''
        uses: pnpm/action-setup@v4
      - if: env.DATABASE_URL != ''
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - if: env.DATABASE_URL != ''
        run: pnpm install --frozen-lockfile
      - if: env.DATABASE_URL != ''
        run: pnpm ingest
